<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Na School! Early access</title>
<meta name="description" content="Play the Na School! early access: a Nigerian secondary-school life sim. Single player, saved on your device.">
<meta name="theme-color" content="#174b3b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/play/fonts.css">
<style>
/* Layout: one-screen life-sim. Dark HUD on top, the live school scene fills the middle, nav on the bottom, panels slide in from the right. Onboarding sits on exercise-book paper. */
:root{
  --ink:#141a2b; --ink2:#3e465d; --mute:#6a7289; --paper:#eef1f6; --card:#ffffff; --line:#d6dce7;
  --hud:#131a2c; --hud2:#1d2640; --hudInk:#f2f4fa; --hudMute:#a9b1c7;
  --school:#1F4E9C; --school2:#FFFFFF; --schoolAcc:#A7AFB8;
  --gold:#e3a72f; --good:#2e8b57; --bad:#c8402f; --warn:#d98a16;
  --chalk:#1f3a2c; --chalk2:#2a4b39; --chalkInk:#eef3ea;
  --rule:#b9cbe6; --margin:#e5a3a3;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0}

/* ---------- Onboarding (exercise book) ---------- */
#onb{overflow:auto;background:
  linear-gradient(90deg,transparent 54px,var(--margin) 54px,var(--margin) 56px,transparent 56px),
  repeating-linear-gradient(180deg,#f8f9fb 0 31px,var(--rule) 31px 32px);}
.onb-wrap{max-width:880px;margin:0 auto;padding-block:24px 56px;padding-inline:16px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand-board{background:var(--chalk);color:var(--chalkInk);border:6px solid #8a5a33;border-radius:10px;padding:10px 18px;box-shadow:0 6px 0 #5f3d22}
.brand-board h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,56px);margin:0;line-height:1;letter-spacing:1px}
.brand-board p{margin:2px 0 0;font-size:13px;opacity:.85}
.brand-note{font-size:13px;color:var(--ink2);max-width:36ch}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{height:6px;flex:1;min-width:22px;border-radius:9px;background:#d5dbe6}
.steps span.on{background:var(--school)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 0 rgba(20,26,43,.05)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);margin:0 0 6px;letter-spacing:.3px}
.card .sub{color:var(--ink2);margin:0 0 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:13px}
.field input,.field select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-width:0;width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;background:var(--ink);color:#fff;letter-spacing:.2px;min-height:44px}
.btn.school{background:var(--school);color:var(--school2)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d03}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pick{display:grid;gap:8px;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:#fff;transition:transform .12s,border-color .12s}
.pick:hover{transform:translateY(-2px)}
.pick.on{border-color:var(--school);box-shadow:0 0 0 3px color-mix(in srgb,var(--school) 22%,transparent)}
.pick h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.3px}
.pick p{margin:0;color:var(--ink2);font-size:14px}
.pick .tagline{font-weight:700;color:var(--ink)}
.pick.taken{opacity:.55;cursor:not-allowed}
.schoolpick{grid-template-columns:auto 1fr;align-items:center}
.schoolpick .figs{display:flex;gap:4px;align-items:flex-end}
.qcount{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.answers{display:grid;gap:10px}
.answer{padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;text-align:left;font-weight:600}
.answer:hover{border-color:var(--school)}
.answer.on{border-color:var(--school);background:color-mix(in srgb,var(--school) 9%,#fff)}
.creator{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:20px}
.creator .preview{background:linear-gradient(#dfe7f4,#f5f7fb);border-radius:14px;display:grid;place-items:center;padding:14px;min-height:360px;position:relative}
.creator .preview .who{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:700;font-size:13px}
.opts{display:grid;gap:14px;min-width:0}
.opt h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.chip.on{border-color:var(--school);background:var(--school);color:var(--school2)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--school)}
.idcard{max-width:440px;margin:0 auto;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 14px 30px rgba(20,26,43,.18);animation:flip .9s ease both}
@keyframes flip{from{transform:perspective(900px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.idcard .top{background:var(--school);color:var(--school2);padding:12px 16px;display:flex;gap:10px;align-items:center}
.idcard .top b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.4px;line-height:1.1}
.idcard .top small{display:block;font-size:11px;opacity:.85}
.idcard .body{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:16px;align-items:center}
.idcard .photo{background:linear-gradient(#e6ecf6,#fff);border-radius:12px;height:150px;display:grid;place-items:end center;overflow:hidden;border:1px solid var(--line)}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.idcard dt{color:var(--mute);font-weight:600}
.idcard dd{margin:0;font-weight:700;min-width:0}
.idcard .foot{padding:10px 16px;border-top:1px dashed var(--line);font-size:13px}
.idcard .foot b{font-family:var(--f-display);font-weight:400;font-size:18px}
.housedot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}

/* ---------- Game shell ---------- */
#game{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}
#hud{background:var(--hud);color:var(--hudInk);padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--school)}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0}
.hud-av{width:40px;height:40px;border-radius:10px;background:var(--hud2);overflow:hidden;display:grid;place-items:start center;border:2px solid var(--school)}
.hud-id b{display:block;font-size:15px;line-height:1.15}
.hud-id small{display:block;font-size:12px;color:var(--hudMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--hud2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill small{color:var(--hudMute);font-weight:600}
.pill.money{color:#ffd88a}
.pill.hungry{background:#5a2a16;color:#ffd2b8}
.iconbtn{position:relative;background:var(--hud2);border-radius:10px;width:38px;height:36px;display:grid;place-items:center;color:var(--hudInk);font-weight:800}
.iconbtn .n{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
#taskbar{display:flex;gap:10px;align-items:center;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.taskline{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;font-size:14px}
.taskline .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--ink);border-radius:6px;padding:2px 7px}
.taskline button{font-weight:700;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rival{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.rival .bar{width:140px;height:12px;border-radius:9px;overflow:hidden;display:flex;background:#ddd}
.rival .bar i{display:block;height:100%}
#scene{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sky,.wall{position:absolute;left:0;right:0;top:0}
.ground,.floor{position:absolute;left:0;right:0;bottom:0}
.sky{height:52%}
.ground{height:48%}
.wall{height:56%}
.floor{height:44%}
.ground.grass{background:linear-gradient(#7fb35a,#5f9a43)}
.ground.concrete{background:linear-gradient(#cfc8ba,#b9b1a1)}
.ground.dirt{background:linear-gradient(#c98f5b,#ab7445)}
.ground.road{background:linear-gradient(#9a9387,#7e776b)}
.floor.tile{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 30px),#d9cfbd}
.floor.wood{background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 70px),#b98b5a}
.floor.cement{background:#bdb5a7}
.bldg{position:absolute;bottom:48%;left:5%;right:5%;height:30%;background:var(--wallC);border-bottom:6px solid rgba(0,0,0,.18)}
.bldg::before{content:"";position:absolute;left:-3%;right:-3%;top:-26%;height:26%;background:var(--roofC);clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}
.bldg .win{position:absolute;top:22%;height:44%;width:9%;background:repeating-linear-gradient(180deg,#6f7c8c 0 3px,#cfd8e2 3px 7px);border:3px solid var(--trimC);border-radius:2px}
.bldg .door{position:absolute;bottom:0;height:60%;width:8%;left:46%;background:var(--doorC);border:3px solid var(--trimC);border-bottom:0}
.bldg .pillar{position:absolute;bottom:0;top:0;width:1.6%;background:var(--trimC)}
.sign{position:absolute;left:50%;transform:translateX(-50%);top:4%;background:var(--signBg);color:var(--signInk);border:3px solid var(--signInk);border-radius:6px;padding:4px 14px;text-align:center;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.25);z-index:3;pointer-events:none}
.sign b{font-family:var(--signFont);font-weight:400;font-size:clamp(14px,2.2vw,20px);letter-spacing:.6px;display:block;line-height:1.1}
.sign small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.night{position:absolute;inset:0;pointer-events:none;z-index:40;transition:background .8s}
.prop{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px}
.prop .lab{font-size:11px;font-weight:800;background:rgba(19,26,44,.86);color:#fff;border-radius:999px;padding:2px 9px;white-space:nowrap}
.prop:hover .lab,.prop:focus-visible .lab{background:var(--gold);color:#2b1d03}
.prop.hint .lab{animation:pulse 1.4s infinite}
@keyframes pulse{50%{background:var(--gold);color:#2b1d03}}
.shape{border-radius:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.blackboard{width:clamp(150px,30vw,300px);height:clamp(70px,12vw,120px);background:var(--chalk);border:6px solid #8a5a33}
.noticeb{width:84px;height:62px;background:#c9a36b;border:5px solid #7a5230;background-image:radial-gradient(#fff 0 6px,transparent 7px),radial-gradient(#ffe48a 0 7px,transparent 8px);background-size:30px 26px;background-position:6px 6px,20px 18px}
.shelf{width:110px;height:110px;background:repeating-linear-gradient(180deg,#7a4f2a 0 6px,transparent 6px 36px),linear-gradient(90deg,#c0392b 0 12%,#2e86c1 12% 22%,#f1c40f 22% 30%,#27ae60 30% 44%,#8e44ad 44% 52%,#e67e22 52% 66%,#2c3e50 66% 76%,#c0392b 76% 88%,#16a085 88%);border:5px solid #7a4f2a}
.counter{width:160px;height:62px;background:linear-gradient(#e8e2d5 0 30%,#9c6b3d 30%);border:4px solid #6f4826}
.bench{width:150px;height:26px;background:#8a5a33;border-radius:3px}
.desk{width:64px;height:30px;background:#a8743f;border:3px solid #6f4826}
.bunk{width:84px;height:96px;border:5px solid #59606e;background:linear-gradient(transparent 0 26%,#3b6aa0 26% 40%,transparent 40% 72%,#a04040 72% 86%,transparent 86%)}
.locker{width:44px;height:84px;background:repeating-linear-gradient(180deg,#7c8b99 0 40px,#5f6c78 40px 42px);border:3px solid #4c5763}
.tree{width:120px;height:150px;background:radial-gradient(circle at 50% 35%,#2f7d3a 0 42%,transparent 43%),linear-gradient(90deg,transparent 44%,#6b4423 44% 56%,transparent 56%);box-shadow:none}
.goal{width:150px;height:70px;border:6px solid #fff;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10px)}
.gatebars{width:150px;height:90px;border:6px solid var(--trimC);background:repeating-linear-gradient(90deg,var(--trimC) 0 5px,transparent 5px 18px)}
.kiosk{width:96px;height:80px;background:linear-gradient(var(--kc,#c0392b) 0 24%,#efe6d4 24%);border:3px solid #6f4826}
.bed{width:120px;height:44px;background:linear-gradient(#f1f1f1 0 40%,#2e86c1 40%);border:4px solid #6f4826;border-radius:6px}
.kettle{width:46px;height:40px;background:#c0c6cf;border-radius:14px 14px 6px 6px}
.store{width:80px;height:84px;background:#6f7884;border:4px solid #3f4650}
.drum{width:44px;height:56px;background:linear-gradient(90deg,#2b6cb0,#4a8fd6,#2b6cb0);border-radius:6px}
.chr{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:left 1.1s ease,top 1.1s ease;z-index:10;cursor:pointer;padding:0}
.chr svg{filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));animation:bob 3.2s ease-in-out infinite}
.chr .tag{order:-1;font-size:11px;font-weight:800;background:#fff;border-radius:999px;padding:1px 7px;white-space:nowrap;border:2px solid var(--ring,#888);margin-bottom:2px;display:flex;gap:4px;align-items:center}
.chr .tag i{font-style:normal;font-size:10px}
.chr.me .tag{background:var(--gold);border-color:#2b1d03}
.chr.glow::after{content:"";position:absolute;bottom:-6px;width:60px;height:14px;border-radius:50%;border:3px solid var(--gold);animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{transform:scale(1.25);opacity:.4}}
@keyframes bob{50%{transform:translateY(-2px)}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:600;max-width:200px;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:30;pointer-events:none;animation:fadeup 5s forwards}
@keyframes fadeup{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.scene-hint{position:absolute;left:12px;bottom:12px;z-index:45;background:rgba(19,26,44,.86);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;max-width:70%}
.exits{position:absolute;right:10px;bottom:10px;z-index:45;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.exits button{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#nav{background:var(--hud);display:flex;justify-content:space-around;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{color:var(--hudInk);display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;padding:5px 8px;border-radius:10px;min-width:52px}
#nav button span{font-size:18px;line-height:1}
#nav button:hover,#nav button.on{background:var(--hud2)}

/* chat dock */
#chatdock{position:absolute;left:10px;top:10px;width:min(330px,60%);z-index:44;background:rgba(19,26,44,.9);color:#fff;border-radius:12px;font-size:12.5px;overflow:hidden}
#chatdock .ch-head{display:flex;gap:4px;padding:6px;flex-wrap:wrap;align-items:center}
#chatdock .ch-head button{color:#cfd5e6;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}
#chatdock .ch-head button.on{background:var(--school);color:var(--school2)}
#chatdock .ch-msgs{max-height:118px;overflow:auto;padding:0 10px 6px;display:grid;gap:3px}
#chatdock .ch-msgs b{color:#ffd88a}
#chatdock .ch-msgs .npc b{color:#9fd3ff}
#chatdock .ch-msgs .sys{color:#a9b1c7;font-style:italic}
#chatdock form{display:flex;border-top:1px solid rgba(255,255,255,.12)}
#chatdock input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:8px 10px}
#chatdock form button{color:#ffd88a;font-weight:800;padding:0 12px}
#chatdock.min .ch-msgs,#chatdock.min form{display:none}

/* panels, modals, menus */
#panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:80;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:slidein .2s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.p-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.3px}
.p-body{overflow:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start}
.x{width:36px;height:36px;border-radius:10px;background:var(--paper);font-weight:800;font-size:18px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff}
.item.done{opacity:.6}
.item .t{min-width:0}
.item .t b{display:block;font-size:14px}
.item .t small{color:var(--mute);font-size:12.5px}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--paper);color:var(--ink2)}
.badge.good{background:#dcefe3;color:#1e6a40}
.badge.bad{background:#f6dcd7;color:#9a2c1d}
.badge.gold{background:#fbecc8;color:#7a5410}
.badge.school{background:var(--school);color:var(--school2)}
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:12px;padding:10px;min-height:66px;text-align:left;background:color-mix(in srgb,var(--school) 10%,#fff);border:2px solid color-mix(in srgb,var(--school) 30%,#fff);font-weight:700;font-size:13px;display:grid;gap:2px;align-content:start}
.tile small{font-weight:600;color:var(--mute);font-size:11px}
.tile.here{background:var(--school);color:var(--school2);border-color:var(--school)}
.tile.here small{color:inherit;opacity:.8}
.tile.lock{background:#f1f2f5;border-style:dashed;border-color:#cdd2dc;color:var(--mute)}
.tile.out{background:#fff6e5;border-color:#f0d9a8}
.tile.rival{background:color-mix(in srgb,var(--rival) 12%,#fff);border-color:color-mix(in srgb,var(--rival) 40%,#fff)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.barrow .tr{height:10px;background:var(--paper);border-radius:9px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--school);border-radius:9px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tblwrap{overflow-x:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bdg{border-radius:12px;padding:10px;border:1px dashed var(--line);font-size:12px;color:var(--mute);display:grid;gap:3px}
.bdg b{font-size:13px;color:var(--ink2)}
.bdg.got{border:2px solid var(--gold);background:#fff8e6;color:var(--ink)}
.kolo{border-radius:14px;padding:14px;background:linear-gradient(135deg,#8a4b1f,#b8702f);color:#fff;display:grid;gap:8px}
.kolo .prog{height:12px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.kolo .prog i{display:block;height:100%;background:#ffd88a}
.big{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.4px;line-height:1}
#modalRoot .back{position:absolute;inset:0;background:rgba(10,14,26,.55);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .18s ease}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.m-head{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.m-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.3px}
.m-head .kicker{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.m-body{padding:6px 18px 12px;display:grid;gap:12px}
.m-foot{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.choice{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff}
.choice:hover{border-color:var(--school)}
.choice b{font-size:15px}
.choice small{color:var(--mute)}
.chalkq{background:var(--chalk);color:var(--chalkInk);border:8px solid #8a5a33;border-radius:12px;padding:16px;display:grid;gap:12px}
.chalkq .q{font-size:18px;font-weight:700}
.chalkq .meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;opacity:.85;gap:8px;flex-wrap:wrap}
.chalkq .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.chalkq .opts button{border:2px solid rgba(238,243,234,.5);border-radius:10px;padding:10px;color:var(--chalkInk);font-weight:700;text-align:left;background:var(--chalk2)}
.chalkq .opts button:hover{border-color:#fff}
.chalkq .opts button.right{background:#2f7d4a;border-color:#7fdc9e}
.chalkq .opts button.wrong{background:#7d2f2f;border-color:#f19a9a}
.timer{height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.timer i{display:block;height:100%;background:#ffd88a;transition:width .2s linear}
.explain{font-size:14px;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.dlg .por{width:84px;height:110px;border-radius:12px;background:linear-gradient(#e6ecf6,#fff);overflow:hidden;display:grid;place-items:start center;border:1px solid var(--line)}
.say{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:15px;position:relative}
.say small{display:block;color:var(--mute);font-weight:700;font-size:12px;margin-bottom:2px}
.prompts{display:grid;gap:6px}
.prompts button{text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;background:#fff}
.prompts button:hover{border-color:var(--school)}
.prompts button .cat{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-right:6px}
.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.risk span{height:12px;border-radius:6px;background:var(--paper)}
.risk.l span:nth-child(1){background:var(--good)}
.risk.m span:nth-child(-n+2){background:var(--warn)}
.risk.h span{background:var(--bad)}
.ledger{font-size:13px}
.ledger div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;gap:8px}
.plus{color:var(--good);font-weight:800}
.minus{color:var(--bad);font-weight:800}
#ctx{position:absolute;z-index:90;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.28);width:230px;overflow:hidden;border:1px solid var(--line)}
#ctx .c-head{padding:10px 12px;background:var(--hud);color:#fff}
#ctx .c-head b{display:block;font-size:14px}
#ctx .c-head small{font-size:11.5px;color:var(--hudMute)}
#ctx .relbar{height:5px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:6px;overflow:hidden}
#ctx .relbar i{display:block;height:100%;background:var(--gold)}
#ctx button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:10px 12px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);gap:8px}
#ctx button:hover{background:var(--paper)}
#ctx button small{color:var(--mute);font-weight:600;font-size:11.5px}
#ctx button.dis{color:var(--mute);cursor:not-allowed}
#toasts{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:120;display:grid;gap:6px;pointer-events:none;width:min(420px,92%)}
.toast{background:var(--hud);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:toast 3.6s forwards;display:flex;gap:8px;align-items:center}
.toast.good{background:#1f6a40}.toast.bad{background:#9a2c1d}.toast.gold{background:#7a5410}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.tut{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--gold);color:#2b1d03;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:92%}
.tut button{text-decoration:underline;font-weight:700;font-size:12px}
.grasses{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grasses button{height:46px;border-radius:10px;background:#5f9a43;color:#fff;font-size:20px}
.grasses button.cut{background:#c4d8a8}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.roster button{border:2px solid var(--line);border-radius:12px;padding:6px;display:grid;justify-items:center;font-size:12px;font-weight:700;background:#fff}
.roster button.sel{border-color:var(--school)}
.roster button .warn{color:var(--bad);font-size:10px}
.catch{background:var(--bad);color:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;animation:pulse3 .8s infinite}
@keyframes pulse3{50%{filter:brightness(1.2)}}
.tester .row{gap:6px}
.note{font-size:12.5px;color:var(--mute)}

@media (max-width:720px){
  .creator{grid-template-columns:1fr}
  .creator .preview{min-height:260px}
  .hud-stats .pill.opt{display:none}
  #nav button b{display:none}
  #nav button{min-width:40px}
  .rival .bar{width:90px}
  #chatdock{width:calc(100% - 20px)}
  #chatdock .ch-msgs{max-height:80px}
  .idcard .body{grid-template-columns:90px 1fr}
  .mapgrid{grid-template-columns:repeat(2,1fr)}
  .exits{max-width:100%;left:10px}
  .scene-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <section id="onb" class="screen"></section>
  <section id="game" class="screen" hidden>
    <header id="hud"></header>
    <div id="taskbar"></div>
    <main id="scene" aria-label="School world"></main>
    <nav id="nav" aria-label="Game menu"></nav>
  </section>
  <aside id="panel" hidden></aside>
  <div id="ctx" hidden></div>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
</div>

<script src="/play/game.js"></script>

</body></html>
